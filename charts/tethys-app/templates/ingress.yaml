{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tethys-app.fullname" . }}
  labels:
    {{- include "tethys-app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.ingress.staticRedirect.enabled }}
          - path: {{ .Values.ingress.staticRedirect.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "tethys-app.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "tethys-app.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
